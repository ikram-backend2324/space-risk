# Render Blueprint (optional — you can also create the service manually with the same commands)
services:
  - type: web
    name: space-risk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed && python manage.py collectstatic --noinput
    startCommand: gunicorn courier_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: space-risk-db
          property: connectionString
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@spacerisk.uz
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

databases:
  - name: space-risk-db
    plan: free
    databaseName: space_risk
