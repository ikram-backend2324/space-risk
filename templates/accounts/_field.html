<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="input-icon">
    <i data-lucide="{{ icon }}"></i>
    {{ field }}
    {% if password %}<button type="button" class="toggle-pass" aria-label="Parolni koʻrsatish"><i data-lucide="eye"></i></button>{% endif %}
  </div>
  {% if meter %}<div class="pw-meter" id="pw-meter"><span></span></div>{% endif %}
  {{ field.errors }}
</div>
