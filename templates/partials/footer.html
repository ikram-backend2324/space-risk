{% load static %}
<footer class="footer">
  <div class="container row-between">
    <a href="{% url 'risk:landing' %}" class="brand"><img src="{% static 'img/logo-mark.svg' %}" alt=""><span>SPACE <b>RISK</b></span></a>
    <span>{{ SITE_TAGLINE }} · {% t "footer.made_for" %}</span>
    <span class="footer-links">
      <a href="{{ TELEGRAM_BOT_URL }}" target="_blank" rel="noopener"><i data-lucide="send"></i>{{ TELEGRAM_BOT_NAME }}</a>
      <a href="{% url 'risk:download_android' %}" download><i data-lucide="download"></i>{% t "apps.android_title" %}</a>
    </span>
    <span class="chip {% if AI_ONLINE %}chip-live{% else %}chip-off{% endif %}">{% if AI_ONLINE %}{% t "footer.ai_online" %}{% else %}{% t "footer.ai_offline" %}{% endif %}</span>
  </div>
</footer>
